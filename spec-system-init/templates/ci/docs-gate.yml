name: docs-gate

# Protected branch: `main`. If the project uses another name (e.g. master, trunk),
# change it in the main-gate `if:` below and in the branch protection rule.
# No job pushes to the protected branch: generated indexes are committed in the PR
# and checked by the "Index check" step (see docs/rules/ci.md).

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  gate-pr:
    name: Docs gate on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # audit --pr needs the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Strict lint
        run: node scripts/specctl.mjs lint --strict
      - name: PR audit (event base)
        run: node scripts/specctl.mjs audit --pr --base "$PR_BASE_SHA"
      - name: Dependency audit (programs)
        run: node scripts/specctl.mjs audit --deps
      - name: Main gate (docs/active/ empty)
        if: github.event.pull_request.base.ref == 'main'
        run: node scripts/specctl.mjs audit --main-gate
      - name: Index check (regenerate + compare, untracked included)
        run: |
          node scripts/specctl.mjs index
          changed="$(git status --porcelain -- docs/INDEX.md docs/ARCHIVE-INDEX.md docs/PROGRAMS.md docs/DEFERRED.md)"
          if [ -n "$changed" ]; then
            echo "Generated indexes are stale or missing — run: node scripts/specctl.mjs index, then commit:"
            echo "$changed"
            git --no-pager diff -- docs/INDEX.md docs/ARCHIVE-INDEX.md docs/PROGRAMS.md docs/DEFERRED.md
            exit 1
          fi

  weekly-audit:
    name: Weekly audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full audit
        run: node scripts/specctl.mjs audit
